name: flutter_pagos
description: Agenda de Pagos y Control de Gastos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de datos local
  sqflite: ^2.3.0
  path: ^1.9.0

  # Estado
  provider: ^6.1.1

  # Notificaciones locales
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Fechas
  intl: ^0.19.0

  # UI
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
